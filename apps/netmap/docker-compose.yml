services:
  netzwerkkarte:
    image: python:3.12-alpine
    container_name: netmap
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data:ro
      - ${APP_DATA_DIR}/data/app:/opt/netzwerkkarte:ro
      - ${APP_DATA_DIR}/data/certs:/certs:ro
      - ${APP_DATA_DIR}/data/config:/config:rw
    command:
      - /bin/sh
      - -c
      - until [ -f /data/web/netzwerkkarte.html ]; do sleep 2; done; i=0; until [ -f /certs/cert.pem ] || [ $i -ge 30 ]; do sleep 2; i=$((i+1)); done; if [ -f /opt/netzwerkkarte/serve_https.py ]; then exec python3 /opt/netzwerkkarte/serve_https.py; else exec python3 -m http.server 8080 --directory /data/web; fi
    x-runtipi:
      is_main: true
      internal_port: 8080
  netzwerkkarte-scanner:
    image: python:3.12-alpine
    container_name: netmap-scanner
    restart: unless-stopped
    # Host-Netzwerk, damit ARP/MAC-Adressen des LAN aufgeloest werden koennen
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      TZ: ${TZ}
      NETZ_SUBNET: ${NETZ_SUBNET:-}
      NETZ_SCAN_INTERVAL: ${NETZ_SCAN_INTERVAL:-900}
      NETZ_FRITZ_URL: ${NETZ_FRITZ_URL:-}
      NETZ_FRITZ_USER: ${NETZ_FRITZ_USER:-}
      NETZ_FRITZ_PASS: ${NETZ_FRITZ_PASS:-}
      NETZ_REPEATER_IPS: ${NETZ_REPEATER_IPS:-}
      NETZ_SNMP_COMMUNITY: ${NETZ_SNMP_COMMUNITY:-}
      NETZ_SNMP_SWITCHES: ${NETZ_SNMP_SWITCHES:-}
      NETZ_EXPORT: ${NETZ_EXPORT:-}
    volumes:
      # data/ aus dem App-Repo wird von Runtipi nach ${APP_DATA_DIR}/data kopiert
      - ${APP_DATA_DIR}/data/app:/opt/netzwerkkarte:ro
      - ${APP_DATA_DIR}/data:/data
    entrypoint:
      - /bin/sh
      - /opt/netzwerkkarte/entrypoint.sh
x-runtipi:
  schema_version: 2
